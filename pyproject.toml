[project]
name = "fastapi-starter"
version = "0.2.0"
description = "A batteries-included FastAPI starter: async SQLAlchemy, Alembic, Taskiq worker, uploads, templates, WebSockets."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ckjackslack" }]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.161",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "taskiq>=0.13",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# Production extras: Postgres driver and the Redis broker / result backend for Taskiq.
postgres = ["asyncpg>=0.32"]
redis = ["taskiq-redis>=1.2.4"]
prod = ["fastapi-starter[postgres,redis]"]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[project.scripts]
fastapi-starter = "fastapi_starter.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:fastapi_starter.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "FAST"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
